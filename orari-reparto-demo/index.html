<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f">
<title>Orari Reparto Demo</title>
<style>
:root{--b:#173f5f;--b2:#2d6d8d;--bg:#f3f6f8;--c:#fff;--t:#17212b;--m:#667784;--bd:#d9e2e7;--ok:#14734b;--bad:#b3261e;--purple:#6f42c1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:12px 14px;box-shadow:0 4px 16px #0d2b3b40}
.header-main{max-width:760px;margin:auto}.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{margin:0;font-size:1.18rem}header small{opacity:.85}
.top-week{display:none;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center;margin-top:10px}.top-week.show{display:grid}.top-week button{height:42px;border:1px solid #ffffff55;background:#ffffff20;color:#fff;border-radius:12px;font-size:1.45rem;font-weight:900}.top-week div{text-align:center;font-weight:900;font-size:.93rem}
main{max-width:760px;margin:auto;padding:14px 14px 92px}.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px #18394b12}.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff}.hero h2,h2,h3{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.btn{border:0;border-radius:14px;padding:12px;font-weight:800;background:#eaf0f4;color:var(--b)}.btn.primary{background:var(--b);color:#fff}.btn.danger{background:#fdecea;color:var(--bad)}.btn.small{padding:8px 10px;font-size:.82rem}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff5;border-top:1px solid var(--bd);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30}nav button{border:0;background:transparent;color:var(--m);padding:7px 2px;font-size:.68rem}nav button b{display:block;font-size:1.1rem}nav button.on{color:var(--b);font-weight:900;background:#edf3f6;border-radius:12px}
.muted{color:var(--m)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.dept{border-left:5px solid var(--b)}.dept.carni{border-left-color:#8a5a2b}.cr{border-left:5px solid var(--purple);background:#faf7ff}.cr .pill{background:#eee5ff;color:var(--purple)}
.shift{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}.shift:first-of-type{border-top:0}.time{font-weight:900}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf3f6;color:var(--b);font-size:.7rem;margin:3px 3px 0 0}.total{font-weight:900}.bad{color:var(--bad)}.ok{color:var(--ok)}
.req{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}.req:first-child{border:0}.hours-table{width:100%;border-collapse:collapse;font-size:.82rem}.hours-table th,.hours-table td{padding:8px 5px;border-bottom:1px solid var(--bd);text-align:right}.hours-table th:first-child,.hours-table td:first-child{text-align:left}.hours-table tr.crrow{background:#faf7ff}.scroll{overflow-x:auto}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:#fff}label{display:grid;gap:5px;color:var(--m);font-size:.8rem;font-weight:750}.form{display:grid;gap:10px}.form.two{grid-template-columns:1fr 1fr}.emp{border-top:1px solid var(--bd);padding:10px 0}.emp:first-child{border:0}.redbox{background:#fff6f5;border-color:#efaaa5}.greenbox{background:#f0faf5;border-color:#a8dcc5}.rotation-note{background:#f7f2ff;border-color:#cab7ee}
@media(max-width:460px){.form.two{grid-template-columns:1fr}.shift{grid-template-columns:1fr auto}.shift .edit{grid-column:2}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="header-main">
    <div class="header-row"><div><h1>Orari Reparto</h1><small>Demo mobile · rotazione CR</small></div></div>
    <div id="topWeek" class="top-week">
      <button type="button" onclick="move(-7)" aria-label="Settimana precedente">‹</button>
      <div id="topWeekLabel"></div>
      <button type="button" onclick="move(7)" aria-label="Settimana successiva">›</button>
    </div>
  </div>
</header>
<main id="app"></main><nav id="nav"></nav>
<script>
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const SKILLS=['Forno','Ordini','Servizio','Macelleria','Pescheria'];
const baseEmployees=[
{name:'Giulio CR',hours:38,cr:true,dept:'misto',skills:{Forno:3,Ordini:3,Servizio:3,Macelleria:3,Pescheria:3}},
{name:'Marco',hours:36,dept:'gastronomia',skills:{Forno:3,Ordini:1,Servizio:3,Macelleria:0,Pescheria:0}},
{name:'Elena',hours:36,dept:'gastronomia',skills:{Forno:1,Ordini:3,Servizio:3,Macelleria:0,Pescheria:0}},
{name:'Luca',hours:30,dept:'gastronomia',skills:{Forno:2,Ordini:1,Servizio:3,Macelleria:0,Pescheria:0}},
{name:'Sara',hours:24,dept:'gastronomia',skills:{Forno:2,Ordini:2,Servizio:3,Macelleria:0,Pescheria:2}},
{name:'Andrea',hours:24,dept:'gastronomia',skills:{Forno:1,Ordini:0,Servizio:3,Macelleria:0,Pescheria:0}},
{name:'Paola',hours:20,dept:'gastronomia',skills:{Forno:1,Ordini:0,Servizio:3,Macelleria:0,Pescheria:0}},
{name:'Chiara',hours:20,dept:'gastronomia',skills:{Forno:1,Ordini:0,Servizio:3,Macelleria:0,Pescheria:0}},
{name:'Michele',hours:36,dept:'carni',skills:{Forno:0,Ordini:0,Servizio:2,Macelleria:3,Pescheria:2}}
];
const defaults={schemaVersion:6,employees:baseEmployees,objectives:{gastronomia:215,carni:50,total:265,prodG:0,prodC:0,rottG:0,rottGE:0,rottC:0,rottCE:0,diffG:0,diffGE:0,diffC:0,diffCE:0},leaves:[],edits:{}};
const STORE='orari_demo_pub_v6';
let S=JSON.parse(localStorage.getItem(STORE)||'null')||JSON.parse(localStorage.getItem('orari_demo_pub_v5')||'null')||defaults;
S=Object.assign({},defaults,S);S.objectives=Object.assign({},defaults.objectives,S.objectives);S.schemaVersion=6;
S.employees=(S.employees||baseEmployees).map(e=>({...e,dept:e.cr?'misto':(e.dept||((e.skills?.Macelleria||0)>=2?'carni':'gastronomia'))}));
let view='home',week=mon(new Date());
const $=s=>document.querySelector(s),key=d=>d.toISOString().slice(0,10),add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
function mon(d){d=new Date(d);d.setHours(12,0,0,0);let n=d.getDay();d.setDate(d.getDate()+(n===0?-6:1-n));return d}
function save(){localStorage.setItem(STORE,JSON.stringify(S))}
function mins(t){let[a,b]=t.split(':').map(Number);return a*60+b}
function hrs(a,b,p=0){return(mins(b)-mins(a)-p)/60}
function hfmt(v){let m=Math.round(v*60),h=Math.floor(m/60),mm=m%60;return `${h}:${String(mm).padStart(2,'0')}`}
function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function onLeave(name,d){let k=key(d);return S.leaves.some(x=>x.name===name&&k>=x.from&&k<=x.to)}
function staff(dept){return S.employees.filter(e=>!e.cr&&(!dept||e.dept===dept))}
function choose(skill,d,load,exclude=[],dept='gastronomia'){
  let pool=staff(dept);
  let c=pool.filter(e=>!exclude.includes(e.name)&&!onLeave(e.name,d)&&(e.skills[skill]||0)>0)
    .sort((a,b)=>(load[a.name]||0)/(a.hours||1)-(load[b.name]||0)/(b.hours||1)||(b.skills[skill]||0)-(a.skills[skill]||0));
  if(!c.length)c=pool.filter(e=>!exclude.includes(e.name)&&!onLeave(e.name,d)).sort((a,b)=>(load[a.name]||0)-(load[b.name]||0));
  return c[0]?.name||'SCOPERTO';
}
function reqStatus(){
  let g=staff('gastronomia'),c=staff('carni'),cr=S.employees.filter(e=>e.cr&&e.hours===38),forno=g.filter(e=>(e.skills.Forno||0)>=2),ord=g.filter(e=>(e.skills.Ordini||0)>=2),fish=g.filter(e=>(e.skills.Pescheria||0)>=1),g36=g.filter(e=>e.hours===36),g30=g.filter(e=>e.hours===30),g24=g.filter(e=>e.hours===24),g20=g.filter(e=>e.hours===20),mac=c.filter(e=>e.hours===36&&(e.skills.Macelleria||0)>=2),support=fish.length>=1,contractHours=S.employees.reduce((a,e)=>a+(Number(e.hours)||0),0),orgOk=cr.length===1&&g36.length===2&&g30.length===1&&g24.length===2&&g20.length===2&&mac.length===1;
  return{cr,forno,ord,fish,g36,g30,g24,g20,mac,support,contractHours,orgOk,ok:orgOk&&forno.length>=3&&ord.length>=2&&support};
}
const CR_CYCLE=[
{start:'06:00',end:'13:30',note:'Apertura · copre il terzo servizio',mode:'morning',pause:15},
{start:'06:00',end:'13:00',start2:'14:00',end2:'15:30',note:'Apertura e assistenza pomeridiana · copre il terzo servizio',mode:'morning',pause:15},
{start:'13:30',end:'20:45',note:'Solo turno serale · solo dalle 13:30 alle 16:30',mode:'evening',pause:15},
{start:'06:30',end:'13:30',note:'Mattina · copre il terzo servizio',mode:'morning',pause:15},
{start:'06:00',end:'13:30',note:'Apertura · copre il terzo servizio',mode:'morning',pause:15},
{start:'09:30',end:'13:30',start2:'16:30',end2:'20:45',note:'Spezzato · copre il servizio mattutino e presidia la chiusura',mode:'split',pause:0}
];
const CR_ANCHOR=mon(new Date('2026-07-20T12:00:00'));
function rotationOffset(){let n=Math.round((week-CR_ANCHOR)/(7*86400000));return((n%6)+6)%6}
function crShift(dayIndex){if(dayIndex===6)return null;let idx=(dayIndex-rotationOffset()+6)%6;return{...CR_CYCLE[idx],cycleIndex:idx}}
function firstSunday(d){return d.getDay()===0&&d.getDate()<=7}
function sundayRestocker(d,load,exclude=[]){
  if(firstSunday(d)){
    let c=staff('carni').filter(e=>!exclude.includes(e.name)&&!onLeave(e.name,d)&&(e.skills.Macelleria||0)>=2&&(e.skills.Servizio||0)>0);
    if(c.length)return{n:c[0].name,butcher:true};
  }
  let c=staff('gastronomia').filter(e=>!exclude.includes(e.name)&&!onLeave(e.name,d)&&(e.skills.Servizio||0)>0)
    .sort((a,b)=>(b.skills.Pescheria||0)-(a.skills.Pescheria||0)||(load[a.name]||0)-(load[b.name]||0));
  return{n:c[0]?.name||'SCOPERTO',butcher:false};
}
function dur(s){return hrs(s.start,s.end,s.pause||0)+(s.start2?hrs(s.start2,s.end2,0):0)}
function push(day,dep,s,load){day[dep].push(s);load[s.name]=(load[s.name]||0)+dur(s)}
function buildWeek(){
  let load={},out=[];
  for(let i=0;i<7;i++){
    let d=add(week,i),day={date:d,g:[],c:[],cr:null},assigned=[];
    let cr=crShift(i),crName=S.employees.find(e=>e.cr)?.name||'Giulio CR';
    if(cr&&!onLeave(crName,d)){day.cr={name:crName,...cr};load[crName]=(load[crName]||0)+dur(day.cr)}
    if(i<6){
      let defs=[['06:15','13:00','Forno'],['06:30','13:30','Ordini']],crMorning=day.cr&&(day.cr.mode==='morning'||day.cr.mode==='split');
      if(!crMorning)defs.push(['09:30','13:30','Servizio']);
      if(day.cr&&day.cr.mode==='evening')defs.push(['16:30','20:45','Chiusura'],['16:30','20:45','Chiusura']);
      else defs.push(['13:30','20:45','Chiusura'],['16:30','20:45','Chiusura']);
      if(i===5)defs.push(['09:30','13:30','Servizio · rinforzo sabato'],['13:00','17:30','Servizio · rinforzo sabato']);
      defs.forEach(x=>{
        let skill=x[2].startsWith('Chiusura')||x[2].startsWith('Servizio')?'Servizio':x[2],n=choose(skill,d,load,assigned);
        assigned.push(n);push(day,'g',{name:n,start:x[0],end:x[1],skill:x[2],pause:(x[1]==='20:45'&&x[0]==='13:30')?15:0},load);
      });
    }else{
      [['07:00','13:30','Servizio gastronomia'],['07:00','13:30','Servizio gastronomia']].forEach(x=>{
        let n=choose('Servizio',d,load,assigned);assigned.push(n);push(day,'g',{name:n,start:x[0],end:x[1],skill:x[2],pause:15},load);
      });
      let r=sundayRestocker(d,load,assigned);assigned.push(r.n);
      push(day,'g',{name:r.n,start:'07:00',end:'13:30',skill:r.butcher?'Macellaio: ripristino carne/pesce → servizio banco Carni':'Ripristino carne/pesce → servizio banco Carni',pause:15},load);
    }
    if(i<6){
      const carni=[
        [['06:30','13:30','Macelleria']],
        [['07:00','13:15','Macelleria']],
        [['06:30','13:30','Macelleria']],
        [['07:00','13:15','Macelleria']],
        [['06:30','13:30','Macelleria'],['06:30','13:30','Vendita pesce · supporto Gastronomia']],
        [['06:30','13:30','Macelleria'],['15:00','18:00','Rifornimento da Gastronomia']]
      ][i];
      let ca=[];
      carni.forEach(x=>{
        let isFish=x[2].includes('pesce'),isSupply=x[2].includes('Rifornimento'),skill=isFish?'Pescheria':(isSupply?'Servizio':'Macelleria'),dept=(isFish||isSupply)?'gastronomia':'carni',n=choose(skill,d,load,ca,dept);
        ca.push(n);push(day,'c',{name:n,start:x[0],end:x[1],skill:x[2],pause:hrs(x[0],x[1])>6?15:0},load);
      });
    }
    out.push(day);
  }
  return out;
}
function applyEdits(days){days.forEach(day=>['g','c'].forEach(dep=>day[dep].forEach((s,i)=>{let e=S.edits[key(day.date)+'-'+dep+'-'+i];if(e)Object.assign(s,e)})));return days}
function weekTotals(days){let g=0,c=0,cr=0;days.forEach(d=>{d.g.forEach(s=>g+=dur(s));d.c.forEach(s=>c+=dur(s));if(d.cr)cr+=dur(d.cr)});return{g,c,cr,total:g+c}}
function employeeTotals(days){let m=Object.fromEntries(S.employees.map(e=>[e.name,0]));days.forEach(d=>{d.g.forEach(s=>m[s.name]=(m[s.name]||0)+dur(s));d.c.forEach(s=>m[s.name]=(m[s.name]||0)+dur(s));if(d.cr)m[d.cr.name]=(m[d.cr.name]||0)+dur(d.cr)});return S.employees.map(e=>{let worked=m[e.name]||0,contract=Number(e.hours)||0;return{...e,worked,extra:Math.max(0,worked-contract),missing:Math.max(0,contract-worked)}})}
function reqHtml(){let r=reqStatus();return `<div class="card ${r.ok?'greenbox':'redbox'}"><h3>Organico e competenze richieste</h3><div class="req"><span>CR condivisibile · 38 h</span><b class="${r.cr.length===1?'ok':'bad'}">${r.cr.length}/1</b></div><div class="req"><span>Gastronomia FT 36 h</span><b class="${r.g36.length===2?'ok':'bad'}">${r.g36.length}/2</b></div><div class="req"><span>Gastronomia PT 30 h</span><b class="${r.g30.length===1?'ok':'bad'}">${r.g30.length}/1</b></div><div class="req"><span>Gastronomia PT 24 h</span><b class="${r.g24.length===2?'ok':'bad'}">${r.g24.length}/2</b></div><div class="req"><span>Gastronomia PT 20 h</span><b class="${r.g20.length===2?'ok':'bad'}">${r.g20.length}/2</b></div><div class="req"><span>Carni: macellaio FT 36 h</span><b class="${r.mac.length===1?'ok':'bad'}">${r.mac.length}/1</b></div><div class="req"><span>Forno autonomi, escluso CR</span><b class="${r.forno.length>=3?'ok':'bad'}">${r.forno.length}/3</b></div><div class="req"><span>Ordini autonomi, escluso CR</span><b class="${r.ord.length>=2?'ok':'bad'}">${r.ord.length}/2</b></div><div class="req"><span>Supporto pescheria dalla Gastronomia</span><b class="${r.support?'ok':'bad'}">${r.support?'OK':'Manca'}</b></div><div class="req"><span>Ore contrattuali complessive</span><b>${r.contractHours} h</b></div></div>`}
function personHoursHtml(days){let rows=employeeTotals(days),extra=rows.reduce((a,e)=>a+e.extra,0);return `<div class="card"><div class="row"><h3>Ore per addetto</h3><b class="${extra>0?'bad':'ok'}">Straordinari totali ${hfmt(extra)}</b></div><div class="scroll"><table class="hours-table"><thead><tr><th>Addetto</th><th>Contratto</th><th>Programmate</th><th>Mancanti</th><th>Straord.</th></tr></thead><tbody>${rows.map(e=>`<tr class="${e.cr?'crrow':''}"><td><b>${html(e.name)}</b><br><small>${e.dept==='carni'?'Carni':e.cr?'CR':'Gastronomia'}</small></td><td>${hfmt(e.hours)}</td><td class="${e.extra>0?'bad':''}">${hfmt(e.worked)}</td><td>${e.missing?hfmt(e.missing):'—'}</td><td class="${e.extra>0?'bad':''}">${e.extra?hfmt(e.extra):'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function nav(){let items=[['home','⌂','Home'],['schedule','▦','Orari'],['skills','✓','Competenze'],['leave','☀','Ferie'],['obj','◎','Obiettivi']];$('#nav').innerHTML=items.map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function updateHeader(){let w=$('#topWeek');w.classList.toggle('show',view==='schedule');$('#topWeekLabel').textContent=`${fmt(week)} – ${fmt(add(week,6))}`}
function go(v){view=v;render()}
function render(){nav();updateHeader();({home:home,schedule:schedule,skills:skills,leave:leave,obj:objectives}[view])()}
function home(){let d=applyEdits(buildWeek()),t=weekTotals(d),over=t.total>S.objectives.total;$('#app').innerHTML=`<section class="card hero"><h2>Settimana in corso</h2><p>${fmt(week)} – ${fmt(add(week,6))}</p><p><b>${hfmt(t.total)} / ${hfmt(S.objectives.total)} ore reparti</b></p><button class="btn" onclick="go('schedule')">Apri orario</button></section><div class="grid"><button class="btn" onclick="go('schedule')">▦ Orari</button><button class="btn" onclick="go('skills')">✓ Competenze</button><button class="btn" onclick="go('leave')">☀ Ferie</button><button class="btn" onclick="go('obj')">◎ Obiettivi</button></div>${reqHtml()}${over?'<div class="card redbox bad"><b>Monte ore complessivo superato</b></div>':''}`}
function shiftRow(s,d,dep,i){return `<div class="shift"><div><b>${html(s.name)}</b><br><span class="pill">${html(s.skill)}</span></div><div class="time">${s.start}–${s.end}${s.start2?`<br>${s.start2}–${s.end2}`:''}</div><button class="btn small edit" onclick="editShift('${key(d)}','${dep}',${i},'${html(s.name)}','${s.start}','${s.end}')">✎</button></div>`}
function schedule(){let days=applyEdits(buildWeek()),t=weekTotals(days),rot=rotationOffset()+1;$('#app').innerHTML=`<div class="card rotation-note"><b>Rotazione CR · settimana ${rot} di 6</b><br><small>Ogni nuova settimana il turno del sabato precedente passa al lunedì e gli altri slittano di un giorno.</small></div><div class="grid"><div class="card"><small>Gastronomia</small><div class="total ${t.g>S.objectives.gastronomia?'bad':''}">${hfmt(t.g)} / ${hfmt(S.objectives.gastronomia)}</div></div><div class="card"><small>Carni</small><div class="total ${t.c>S.objectives.carni?'bad':''}">${hfmt(t.c)} / ${hfmt(S.objectives.carni)}</div></div></div>${personHoursHtml(days)}${days.map((d,di)=>`<section class="card"><div class="row"><h3>${DAYS[di]} ${fmt(d.date)}</h3><b>${hfmt(d.g.reduce((a,s)=>a+dur(s),0)+d.c.reduce((a,s)=>a+dur(s),0))}</b></div>${d.cr?`<div class="card cr"><b>${html(d.cr.name)} · CR</b><div class="time">${d.cr.start}–${d.cr.end}${d.cr.start2?` / ${d.cr.start2}–${d.cr.end2}`:''}</div><span class="pill">${html(d.cr.note)}</span><div><small>${hfmt(dur(d.cr))}</small></div></div>`:''}<div class="card dept"><h3>Gastronomia e forneria</h3>${d.g.map((s,i)=>shiftRow(s,d.date,'g',i)).join('')}<div class="total">Totale: ${hfmt(d.g.reduce((a,s)=>a+dur(s),0))}</div></div><div class="card dept carni"><h3>Carni e pescheria</h3>${d.c.length?d.c.map((s,i)=>shiftRow(s,d.date,'c',i)).join(''):'<p class="muted">La domenica il terzo addetto delle 7:00 ripristina carne e pesce, poi serve al banco Carni.</p>'}<div class="total">Totale: ${hfmt(d.c.reduce((a,s)=>a+dur(s),0))}</div></div></section>`).join('')}`}
function move(n){week=add(week,n);updateHeader();if(view==='schedule')schedule();else render()}
function editShift(date,dep,i,name,start,end){let nn=prompt('Addetto',name);if(nn===null)return;let ns=prompt('Entrata',start);if(ns===null)return;let ne=prompt('Uscita',end);if(ne===null)return;S.edits[date+'-'+dep+'-'+i]={name:nn,start:ns,end:ne};save();schedule()}
function skills(){$('#app').innerHTML=reqHtml()+`<div class="card"><h2>Addetti e competenze</h2><p class="muted">Livello 2 o 3 = autonomo. Il turno vendita pesce del venerdì viene preso dalla Gastronomia.</p>${S.employees.map((e,i)=>`<div class="emp"><div class="row"><b>${html(e.name)} ${e.cr?'<span class="pill">CR</span>':''}</b><button class="btn small" onclick="editProfile(${i})">Profilo</button></div><small>${e.hours} ore · ${e.dept==='carni'?'Carni':e.cr?'CR misto':'Gastronomia'}</small><div>${SKILLS.map(k=>`<span class="pill">${k}: ${e.skills[k]||0}</span>`).join('')}</div><button class="btn small" onclick="editSkills(${i})">Modifica competenze</button></div>`).join('')}<button class="btn primary" onclick="addEmp()">+ Aggiungi addetto</button></div>`}
function editProfile(i){let e=S.employees[i],n=prompt('Nome',e.name);if(n===null)return;let h=prompt('Ore contrattuali',e.hours);if(h===null)return;let d=e.cr?'misto':prompt('Reparto: gastronomia oppure carni',e.dept||'gastronomia');e.name=n||e.name;e.hours=Number(h)||e.hours;if(!e.cr&&['gastronomia','carni'].includes(String(d).toLowerCase()))e.dept=String(d).toLowerCase();save();skills()}
function editSkills(i){SKILLS.forEach(k=>{let v=prompt(`${k} (0-3)`,S.employees[i].skills[k]||0);if(v!==null)S.employees[i].skills[k]=Math.max(0,Math.min(3,Number(v)||0))});save();skills()}
function addEmp(){let n=prompt('Nome addetto');if(!n)return;let h=Number(prompt('Ore contrattuali','24'))||24,d=prompt('Reparto: gastronomia oppure carni','gastronomia')||'gastronomia';S.employees.push({name:n,hours:h,dept:String(d).toLowerCase()==='carni'?'carni':'gastronomia',skills:Object.fromEntries(SKILLS.map(k=>[k,0]))});save();skills()}
function leave(){$('#app').innerHTML=`<div class="card"><h2>Ferie</h2><form class="form" onsubmit="addLeave(event)"><label>Addetto<select id="ln">${S.employees.map(e=>`<option>${html(e.name)}</option>`).join('')}</select></label><div class="form two"><label>Dal<input id="lf" type="date" required></label><label>Al<input id="lt" type="date" required></label></div><button class="btn primary">Inserisci ferie</button></form></div>${S.leaves.map((x,i)=>`<div class="card row"><div><b>${html(x.name)}</b><br><small>${x.from} → ${x.to}</small></div><button class="btn danger small" onclick="delLeave(${i})">Elimina</button></div>`).join('')}`}
function addLeave(e){e.preventDefault();S.leaves.push({name:$('#ln').value,from:$('#lf').value,to:$('#lt').value});save();view='schedule';render()}
function delLeave(i){S.leaves.splice(i,1);save();leave()}
function objectives(){let o=S.objectives;$('#app').innerHTML=`<form class="card form" onsubmit="saveObj(event)"><h2>Obiettivi reparto</h2><div class="form two"><label>Gastronomia ore<input id="og" type="number" step=".25" value="${o.gastronomia}"></label><label>Carni ore<input id="oc" type="number" step=".25" value="${o.carni}"></label></div><label>Totale reparti<input id="ot" type="number" step=".25" value="${o.total}"></label><h3>Gastronomia</h3><div class="form two"><label>Produttività €/ora<input id="pg" type="number" step=".01" value="${o.prodG}"></label><label>Rotture %<input id="rg" type="number" step=".01" value="${o.rottG}"></label><label>Rotture €<input id="rge" type="number" step=".01" value="${o.rottGE}"></label><label>Differenze %<input id="dg" type="number" step=".01" value="${o.diffG}"></label><label>Differenze €<input id="dge" type="number" step=".01" value="${o.diffGE}"></label></div><h3>Carni</h3><div class="form two"><label>Produttività €/ora<input id="pc" type="number" step=".01" value="${o.prodC}"></label><label>Rotture %<input id="rc" type="number" step=".01" value="${o.rottC}"></label><label>Rotture €<input id="rce" type="number" step=".01" value="${o.rottCE}"></label><label>Differenze %<input id="dc" type="number" step=".01" value="${o.diffC}"></label><label>Differenze €<input id="dce" type="number" step=".01" value="${o.diffCE}"></label></div><button class="btn primary">Salva obiettivi</button></form>`}
function saveObj(e){e.preventDefault();let ids=['og','oc','ot','pg','rg','rge','dg','dge','pc','rc','rce','dc','dce'],ks=['gastronomia','carni','total','prodG','rottG','rottGE','diffG','diffGE','prodC','rottC','rottCE','diffC','diffCE'];ids.forEach((id,i)=>S.objectives[ks[i]]=Number($('#'+id).value)||0);save();view='home';render()}
save();render();
</script>
</body>
</html>
