<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f5f"><title>Orari Reparto</title><style>
:root{--b:#173f5f;--b2:#2d6d8d;--bg:#f3f6f8;--bd:#d9e2e7;--bad:#b3261e;--ok:#14734b;--p:#6f42c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17212b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:11px 14px;box-shadow:0 4px 14px #0003}.head{max-width:760px;margin:auto}h1{font-size:1.15rem;margin:0}.weekbar{display:none;grid-template-columns:45px 1fr 45px;gap:8px;align-items:center;margin-top:9px}.weekbar.on{display:grid}.weekbar button{height:40px;border:1px solid #fff5;border-radius:12px;background:#fff2;color:#fff;font-size:1.4rem}.weekbar div{text-align:center;font-weight:800}main{max-width:760px;margin:auto;padding:13px 13px 88px}.card{background:#fff;border:1px solid var(--bd);border-radius:17px;padding:13px;margin-bottom:11px;box-shadow:0 5px 18px #173f5f12}.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:0;border-radius:12px;padding:10px;font-weight:800;background:#eaf0f4;color:var(--b)}.btn.small{padding:7px 9px;font-size:.78rem}.btn.primary{background:var(--b);color:#fff}.btn.danger{background:#fdecea;color:var(--bad)}nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff5;border-top:1px solid var(--bd);padding:6px}nav button{border:0;background:transparent;padding:7px 2px;color:#667784;font-size:.68rem}nav button b{display:block;font-size:1.05rem}nav button.on{color:var(--b);font-weight:900;background:#edf3f6;border-radius:10px}.dept{border-left:5px solid var(--b)}.carni{border-left-color:#8a5a2b}.cr{border-left:5px solid var(--p);background:#faf7ff}.shift{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.shift:first-child{border-top:0}.time{font-weight:900}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf3f6;color:var(--b);font-size:.7rem;margin-top:3px}.bad{color:var(--bad)}.ok{color:var(--ok)}.muted{color:#667784}.req{display:grid;grid-template-columns:1fr auto;gap:7px;padding:7px 0;border-top:1px solid var(--bd)}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow-x:auto}.crrow{background:#faf7ff}.redbox{background:#fff6f5}.greenbox{background:#f0faf5}.purplebox{background:#f7f2ff}input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:11px;background:#fff}label{display:grid;gap:4px;font-size:.8rem;font-weight:750;color:#667784}.form{display:grid;gap:9px}.emp{padding:9px 0;border-top:1px solid var(--bd)}@media(max-width:460px){.shift{grid-template-columns:1fr auto}.shift .edit{grid-column:2}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="head"><h1>Orari Reparto</h1><small>Rotazioni, ferie e straordinari</small><div id="weekbar" class="weekbar"><button onclick="move(-7)">‹</button><div id="weeklabel"></div><button onclick="move(7)">›</button></div></div></header><main id="app"></main><nav id="nav"></nav><script>
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'],SKILLS=['Forno','Ordini','Servizio','Macelleria','Pescheria'];
const base=[{name:'Giulio CR',hours:38,cr:true,dept:'misto',skills:{Forno:3,Ordini:3,Servizio:3,Macelleria:3,Pescheria:3}},{name:'Marco',hours:36,dept:'gastronomia',skills:{Forno:3,Ordini:1,Servizio:3,Macelleria:2,Pescheria:0}},{name:'Elena',hours:36,dept:'gastronomia',skills:{Forno:1,Ordini:3,Servizio:3,Macelleria:0,Pescheria:0}},{name:'Luca',hours:30,dept:'gastronomia',skills:{Forno:2,Ordini:1,Servizio:3,Macelleria:0,Pescheria:0}},{name:'Sara',hours:24,dept:'gastronomia',skills:{Forno:2,Ordini:2,Servizio:3,Macelleria:0,Pescheria:2}},{name:'Andrea',hours:24,dept:'gastronomia',skills:{Forno:1,Ordini:0,Servizio:3,Macelleria:0,Pescheria:0}},{name:'Paola',hours:20,dept:'gastronomia',skills:{Forno:1,Ordini:0,Servizio:3,Macelleria:0,Pescheria:0}},{name:'Chiara',hours:20,dept:'gastronomia',skills:{Forno:1,Ordini:0,Servizio:3,Macelleria:0,Pescheria:0}},{name:'Michele',hours:36,dept:'carni',skills:{Forno:0,Ordini:0,Servizio:2,Macelleria:3,Pescheria:2}}];
const DEF={employees:base,leaves:[],edits:{},objectives:{gastronomia:215,carni:50,total:265}},STORE='orari_demo_pub_v8';let S=JSON.parse(localStorage.getItem(STORE)||'null')||JSON.parse(localStorage.getItem('orari_demo_pub_v7')||'null')||DEF;S={...DEF,...S,objectives:{...DEF.objectives,...S.objectives}};S.employees=(S.employees||base).map(e=>({...e,skills:{Forno:0,Ordini:0,Servizio:0,Macelleria:0,Pescheria:0,...e.skills},dept:e.cr?'misto':(e.dept||'gastronomia')}));if(!S.employees.some(e=>!e.cr&&e.dept==='gastronomia'&&e.skills.Macelleria>=2)){let x=S.employees.find(e=>!e.cr&&e.dept==='gastronomia'&&e.hours===36);if(x)x.skills.Macelleria=2}let view='home',week=mon(new Date());
const $=q=>document.querySelector(q),add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},key=d=>d.toISOString().slice(0,10),fmt=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});function mon(d){d=new Date(d);d.setHours(12,0,0,0);let n=d.getDay();d.setDate(d.getDate()+(n===0?-6:1-n));return d}function save(){localStorage.setItem(STORE,JSON.stringify(S))}function mins(t){let[a,b]=t.split(':').map(Number);return a*60+b}function hrs(a,b,p=0){return(mins(b)-mins(a)-p)/60}function dur(s){if(s.coveredByCR)return 0;return hrs(s.start,s.end,s.pause||0)+(s.start2?hrs(s.start2,s.end2):0)}function hf(v){let m=Math.round(v*60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function leave(name,d){let k=key(d);return S.leaves.some(x=>x.name===name&&k>=x.from&&k<=x.to)}function staff(dep){return S.employees.filter(e=>!e.cr&&(!dep||e.dept===dep))}
function choose(skill,d,load,exclude=[],dep='gastronomia'){let a=staff(dep).filter(e=>!exclude.includes(e.name)&&!leave(e.name,d)&&e.skills[skill]>0).sort((x,y)=>(load[x.name]||0)/(x.hours||1)-(load[y.name]||0)/(y.hours||1)||y.skills[skill]-x.skills[skill]);if(!a.length)a=staff(dep).filter(e=>!exclude.includes(e.name)&&!leave(e.name,d));return a[0]?.name||'SCOPERTO'}
const CRC=[{start:'06:00',end:'13:30',mode:'morning',note:'Apertura · copre servizio',pause:15},{start:'06:00',end:'13:00',start2:'14:00',end2:'15:30',mode:'morning',note:'Apertura + assistenza',pause:15},{start:'13:30',end:'20:45',mode:'evening',note:'Solo serale',pause:15},{start:'06:30',end:'13:30',mode:'morning',note:'Mattina · copre servizio',pause:15},{start:'06:00',end:'13:30',mode:'morning',note:'Apertura · copre servizio',pause:15},{start:'09:30',end:'13:30',start2:'16:30',end2:'20:45',mode:'split',note:'Spezzato · servizio e chiusura',pause:0}],ANCH=mon(new Date('2026-07-20T12:00:00'));function wi(){return Math.round((week-ANCH)/604800000)}function off(){return((wi()%6)+6)%6}function crShift(i){if(i===6)return null;return{...CRC[(i-off()+6)%6]}}function swapSat(){return((wi()%2)+2)%2===1}function push(day,dep,s,load){day[dep].push(s);load[s.name]=(load[s.name]||0)+dur(s)}function crCanMorning(c){return c&&mins(c.start)<=390&&mins(c.end)>=810}
function build(){let load={},out=[];for(let i=0;i<7;i++){let d=add(week,i),day={date:d,g:[],c:[],cr:null},used=[],reserved=[];let cr=crShift(i),crName=S.employees.find(e=>e.cr)?.name||'Giulio CR';if(cr&&!leave(crName,d)){day.cr={name:crName,...cr};load[crName]=(load[crName]||0)+dur(day.cr)}let backup=i===5?staff('gastronomia').filter(e=>!leave(e.name,d)&&e.skills.Macelleria>=2).sort((a,b)=>(load[a.name]||0)-(load[b.name]||0))[0]:null;if(backup)reserved.push(backup.name);
if(i<6){let t=[['06:15','13:00','Forno'],['06:30','13:30','Ordini']],cm=day.cr&&(day.cr.mode==='morning'||day.cr.mode==='split');if(!cm)t.push(['09:30','13:30','Servizio']);if(day.cr?.mode==='evening')t.push(['16:30','20:45','Chiusura'],['16:30','20:45','Chiusura']);else t.push(['13:30','20:45','Chiusura'],['16:30','20:45','Chiusura']);if(i===5)t.push(['09:30','13:30','Rinforzo sabato'],['13:00','17:30','Rinforzo sabato']);t.forEach(x=>{let sk=['Servizio','Chiusura','Rinforzo sabato'].some(z=>x[2].includes(z))?'Servizio':x[2],n=choose(sk,d,load,used.concat(reserved));used.push(n);push(day,'g',{name:n,start:x[0],end:x[1],skill:x[2],pause:x[0]==='13:30'?15:0},load)})}else{for(let j=0;j<2;j++){let n=choose('Servizio',d,load,used);used.push(n);push(day,'g',{name:n,start:'07:00',end:'13:30',skill:'Servizio gastronomia',pause:15},load)}let candidates=(d.getDate()<=7?staff('carni'):staff('gastronomia')).filter(e=>!used.includes(e.name)&&!leave(e.name,d)&&e.skills.Servizio>0).sort((a,b)=>(load[a.name]||0)-(load[b.name]||0));let n=candidates[0]?.name||choose('Servizio',d,load,used);push(day,'g',{name:n,start:'07:00',end:'13:30',skill:'Ripristino carne/pesce → banco Carni',pause:15},load)}
if(i<5){let arr=[[['06:30','13:30','Macelleria']],[['07:00','13:15','Macelleria']],[['06:30','13:30','Macelleria']],[['07:00','13:15','Macelleria']],[['06:30','13:30','Macelleria'],['06:30','13:30','Vendita pesce · Gastronomia']]][i],cu=[];arr.forEach(x=>{let fish=x[2].includes('pesce'),n=choose(fish?'Pescheria':'Macelleria',d,load,fish?used:cu,fish?'gastronomia':'carni');cu.push(n);push(day,'c',{name:n,start:x[0],end:x[1],skill:x[2],pause:hrs(x[0],x[1])>6?15:0},load)})}else if(i===5){let main=staff('carni').filter(e=>!leave(e.name,d)&&e.skills.Macelleria>=2)[0],morning,afternoon,crCover=false;if(swapSat()){afternoon=main?.name||'SCOPERTO';if(backup)morning=backup.name;else if(crCanMorning(day.cr)){morning=day.cr.name;crCover=true}else morning='SCOPERTO'}else{morning=main?.name||'SCOPERTO';afternoon=backup?.name||'SCOPERTO'}push(day,'c',{name:morning,start:'06:30',end:'13:30',skill:crCover?'Macelleria mattina · nel turno CR':'Macelleria mattina',pause:15,coveredByCR:crCover},load);push(day,'c',{name:afternoon,start:'15:00',end:'18:00',skill:'Macelleria pomeriggio · rotazione'},load)}out.push(day)}return out}
function edited(ds){ds.forEach(d=>['g','c'].forEach(dep=>d[dep].forEach((s,i)=>Object.assign(s,S.edits[key(d.date)+'-'+dep+'-'+i]||{}))));return ds}function totals(ds){let g=0,c=0;ds.forEach(d=>{d.g.forEach(s=>g+=dur(s));d.c.forEach(s=>c+=dur(s))});return{g,c,total:g+c}}function people(ds){let m={};S.employees.forEach(e=>m[e.name]=0);ds.forEach(d=>{d.g.forEach(s=>m[s.name]=(m[s.name]||0)+dur(s));d.c.forEach(s=>m[s.name]=(m[s.name]||0)+dur(s));if(d.cr)m[d.cr.name]=(m[d.cr.name]||0)+dur(d.cr)});return S.employees.map(e=>({...e,worked:m[e.name]||0,extra:Math.max(0,(m[e.name]||0)-e.hours),missing:Math.max(0,e.hours-(m[e.name]||0))}))}
function requirements(){let g=staff('gastronomia'),c=staff('carni'),r={cr:S.employees.filter(e=>e.cr&&e.hours===38).length,g36:g.filter(e=>e.hours===36).length,g30:g.filter(e=>e.hours===30).length,g24:g.filter(e=>e.hours===24).length,g20:g.filter(e=>e.hours===20).length,mac:c.filter(e=>e.hours===36&&e.skills.Macelleria>=2).length,backup:g.filter(e=>e.skills.Macelleria>=2).length,forno:g.filter(e=>e.skills.Forno>=2).length,ord:g.filter(e=>e.skills.Ordini>=2).length,fish:g.filter(e=>e.skills.Pescheria>=1).length};r.ok=r.cr===1&&r.g36===2&&r.g30===1&&r.g24===2&&r.g20===2&&r.mac===1&&r.backup>=1&&r.forno>=3&&r.ord>=2&&r.fish>=1;return r}
function reqHtml(){let r=requirements(),x=(l,v,n)=>`<div class="req"><span>${l}</span><b class="${v>=n?'ok':'bad'}">${v}/${n}</b></div>`;return `<div class="card ${r.ok?'greenbox':'redbox'}"><h3>Organico e competenze</h3>${x('CR 38 ore',r.cr,1)}${x('FT Gastronomia 36 ore',r.g36,2)}${x('PT 30 ore',r.g30,1)}${x('PT 24 ore',r.g24,2)}${x('PT 20 ore',r.g20,2)}${x('Macellaio FT 36 ore',r.mac,1)}${x('Secondo competente Macelleria, escluso CR',r.backup,1)}${x('Autonomi forno',r.forno,3)}${x('Autonomi ordini',r.ord,2)}${x('Supporto pescheria Gastronomia',r.fish,1)}</div>`}
function hoursHtml(ds){let p=people(ds),ot=p.reduce((a,e)=>a+e.extra,0);return `<div class="card"><div class="row"><h3>Ore per addetto</h3><b class="${ot?'bad':'ok'}">Straordinari ${hf(ot)}</b></div><div class="scroll"><table><tr><th>Addetto</th><th>Contr.</th><th>Prog.</th><th>Manc.</th><th>Extra</th><th></th></tr>${p.map(e=>`<tr class="${e.cr?'crrow':''}"><td><b>${esc(e.name)}</b><br><small>${e.cr?'CR':e.dept==='carni'?'Carni':'Gastronomia'}</small></td><td>${hf(e.hours)}</td><td>${hf(e.worked)}</td><td>${e.missing?hf(e.missing):'—'}</td><td class="${e.extra?'bad':''}">${e.extra?hf(e.extra):'—'}</td><td><button class="btn small" onclick="quickLeave('${esc(e.name)}')">Ferie</button></td></tr>`).join('')}</table></div></div>`}
function nav(){let a=[['home','⌂','Home'],['schedule','▦','Orari'],['skills','✓','Competenze'],['leave','☀','Ferie'],['obj','◎','Obiettivi']];$('#nav').innerHTML=a.map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}function header(){let b=$('#weekbar');b.classList.toggle('on',view==='schedule');$('#weeklabel').textContent=`${fmt(week)} – ${fmt(add(week,6))}`}function go(v){view=v;render()}function render(){nav();header();({home,schedule,skills,leave:leavePage,obj}[view])()}
function home(){let ds=edited(build()),t=totals(ds);$('#app').innerHTML=`<div class="card hero"><h2>Settimana in corso</h2><p>${fmt(week)} – ${fmt(add(week,6))}</p><b>${hf(t.total)} / ${hf(S.objectives.total)} ore reparti</b><p><button class="btn" onclick="go('schedule')">Apri orario</button></p></div>${reqHtml()}`}
function shiftRow(s,d,dep,i){return `<div class="shift"><div><b>${esc(s.name)}</b><br><span class="pill">${esc(s.skill)}</span></div><div class="time">${s.start}–${s.end}</div><button class="btn small edit" onclick="editShift('${key(d)}','${dep}',${i},'${esc(s.name)}','${s.start}','${s.end}')">✎</button></div>`}
function schedule(){let ds=edited(build()),t=totals(ds);$('#app').innerHTML=`<div class="card purplebox"><b>CR: rotazione settimana ${off()+1}/6</b><br><small>Sabato: macellaio e secondo competente si alternano tra mattina e 15:00–18:00.</small></div><div class="grid"><div class="card"><small>Gastronomia</small><b>${hf(t.g)} / ${hf(S.objectives.gastronomia)}</b></div><div class="card"><small>Carni</small><b>${hf(t.c)} / ${hf(S.objectives.carni)}</b></div></div>${hoursHtml(ds)}${ds.map((d,i)=>`<section class="card"><div class="row"><h3>${DAYS[i]} ${fmt(d.date)}</h3><b>${hf(d.g.reduce((a,s)=>a+dur(s),0)+d.c.reduce((a,s)=>a+dur(s),0))}</b></div>${d.cr?`<div class="card cr"><b>${esc(d.cr.name)} · CR</b><div class="time">${d.cr.start}–${d.cr.end}${d.cr.start2?` / ${d.cr.start2}–${d.cr.end2}`:''}</div><span class="pill">${d.cr.note}</span></div>`:''}<div class="card dept"><h3>Gastronomia</h3>${d.g.map((s,j)=>shiftRow(s,d.date,'g',j)).join('')}</div><div class="card dept carni"><h3>Carni e pescheria</h3>${d.c.length?d.c.map((s,j)=>shiftRow(s,d.date,'c',j)).join(''):'<p class="muted">Il terzo addetto delle 7:00 ripristina e poi serve al banco Carni.</p>'}</div></section>`).join('')}`}
function move(n){week=add(week,n);header();schedule()}function editShift(date,dep,i,name,start,end){let n=prompt('Addetto',name);if(n===null)return;let a=prompt('Entrata',start);if(a===null)return;let b=prompt('Uscita',end);if(b===null)return;S.edits[`${date}-${dep}-${i}`]={name:n,start:a,end:b};save();schedule()}function quickLeave(name){let f=prompt('Ferie dal',key(week));if(!f)return;let t=prompt('Ferie al',key(add(week,6)));if(!t)return;S.leaves.push({name,from:f,to:t});save();schedule()}
function skills(){$('#app').innerHTML=reqHtml()+`<div class="card"><h2>Addetti e competenze</h2>${S.employees.map((e,i)=>`<div class="emp"><div class="row"><b>${esc(e.name)}</b><button class="btn small" onclick="profile(${i})">Profilo</button></div><small>${e.hours} ore · ${e.cr?'CR':e.dept}</small><div>${SKILLS.map(k=>`<span class="pill">${k}: ${e.skills[k]}</span>`).join('')}</div><button class="btn small" onclick="editSkills(${i})">Competenze</button></div>`).join('')}</div>`}function profile(i){let e=S.employees[i],n=prompt('Nome',e.name);if(n===null)return;let h=prompt('Ore',e.hours);if(h===null)return;e.name=n||e.name;e.hours=Number(h)||e.hours;save();skills()}function editSkills(i){SKILLS.forEach(k=>{let v=prompt(`${k} 0-3`,S.employees[i].skills[k]);if(v!==null)S.employees[i].skills[k]=Math.max(0,Math.min(3,Number(v)||0))});save();skills()}
function leavePage(){$('#app').innerHTML=`<div class="card"><h2>Ferie</h2><form class="form" onsubmit="addLeave(event)"><label>Addetto<select id="ln">${S.employees.map(e=>`<option>${esc(e.name)}</option>`).join('')}</select></label><label>Dal<input id="lf" type="date" required></label><label>Al<input id="lt" type="date" required></label><button class="btn primary">Inserisci</button></form></div>${S.leaves.map((x,i)=>`<div class="card row"><span><b>${esc(x.name)}</b><br><small>${x.from} → ${x.to}</small></span><button class="btn danger small" onclick="delLeave(${i})">Elimina</button></div>`).join('')}`}function addLeave(e){e.preventDefault();S.leaves.push({name:$('#ln').value,from:$('#lf').value,to:$('#lt').value});save();view='schedule';render()}function delLeave(i){S.leaves.splice(i,1);save();leavePage()}
function obj(){$('#app').innerHTML=`<form class="card form" onsubmit="saveObj(event)"><h2>Obiettivi ore</h2><label>Gastronomia<input id="og" type="number" step=".25" value="${S.objectives.gastronomia}"></label><label>Carni<input id="oc" type="number" step=".25" value="${S.objectives.carni}"></label><label>Totale<input id="ot" type="number" step=".25" value="${S.objectives.total}"></label><button class="btn primary">Salva</button></form>`}function saveObj(e){e.preventDefault();S.objectives={gastronomia:Number($('#og').value)||0,carni:Number($('#oc').value)||0,total:Number($('#ot').value)||0};save();go('home')}save();render();
</script></body></html>
