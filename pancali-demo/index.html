<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Demo controllo pancali</title><style>body{font-family:Arial;margin:0;background:#f3f6f8;color:#14213d}header{background:#102a43;color:#fff;padding:16px;position:sticky;top:0}main{padding:14px;max-width:760px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0001}button,input,select{font-size:16px;padding:12px;border-radius:10px;border:1px solid #ccd}button{font-weight:700}.p{background:#102a43;color:#fff}.g{background:#dcfce7;color:#166534}.r{background:#fee2e2;color:#991b1b}.w{background:#fef3c7;color:#92400e}.row{display:flex;gap:8px}.row>*{flex:1}.status{padding:16px;border-radius:12px;font-weight:800;margin-top:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.small{font-size:12px;color:#64748b}video{width:100%;border-radius:12px;background:#000}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.hide{display:none}</style><script src="https://unpkg.com/@zxing/browser@latest"></script></head><body><header><b>Controllo pancali · Demo</b><div class="small" style="color:#cbd5e1">50 prodotti fittizi · uso da telefono</div></header><main><div class="tabs"><button onclick="show('scan')">Controllo</button><button onclick="show('db')">Database</button></div><section id="scan"><div class="card"><h3>1. Strip del pancale</h3><input type="file" accept="image/*" capture="environment" onchange="preview(this)"><div id="pic"></div><button class="p" onclick="loadStrip()">Carica strip demo</button><p class="small">La foto viene caricata; la lettura OCR è simulata in questa versione.</p></div><div class="card"><h3>2. Controlla collo</h3><div class="row"><input id="code" inputmode="numeric" placeholder="Codice cartone"><button class="p" onclick="check()">Controlla</button></div><div class="row" style="margin-top:8px"><button class="g" onclick="demo('290000000011')">Corretto</button><button class="r" onclick="demo('290000000017')">Errore</button><button class="w" onclick="demo('999999999999')">Sconosciuto</button></div><button style="margin-top:8px;width:100%" onclick="camera()">Apri fotocamera</button><div id="cam" class="hide"><video id="video" playsinline></video><button class="r" onclick="stop()">Chiudi</button></div><div id="status"></div></div><div class="card"><h3>Riepilogo</h3><div id="sum">Carica la strip demo.</div><table><thead><tr><th>Prodotto</th><th>Prev.</th><th>Letti</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="db" class="hide"><div class="card"><h3>Database 50 prodotti</h3><input id="search" placeholder="Cerca prodotto" oninput="renderDB()"><button class="p" style="margin-top:8px" onclick="addProduct()">Aggiungi manualmente</button><table><thead><tr><th>Interno</th><th>Cartone</th><th>Descrizione</th></tr></thead><tbody id="dbrows"></tbody></table></div></section></main><script>const names=['Prosciutto cotto','Prosciutto crudo','Mortadella','Salame toscano','Finocchiona','Soppressata','Capocollo stagionato','Pancetta arrotolata','Speck','Bresaola','Fesa tacchino','Roast beef','Porchetta','Coppa di testa','Parmigiano 24 mesi','Parmigiano 36 mesi','Grana Padano','Pecorino fresco','Pecorino stagionato','Pecorino romano','Gorgonzola dolce','Gorgonzola piccante','Taleggio','Brie','Fontina','Asiago','Scamorza affumicata','Provolone dolce','Mozzarella filone','Ricotta','Insalata russa','Insalata capricciosa','Vitello tonnato','Pollo arrosto','Lasagne','Cannelloni','Parmigiana','Polpette','Arista cotta','Patate arrosto','Verdure grigliate','Olive verdi','Olive nere','Carciofini','Pomodori secchi','Peperoni grigliati','Tacchino alle erbe','Caciotta','Emmental','Edamer'];let db=JSON.parse(localStorage.getItem('pdb')||'null')||names.map((n,i)=>({internal:'GAST'+String(i+1).padStart(4,'0'),carton:'2900000000'+String(i+1).padStart(2,'0'),description:n}));let strip=[],reader,controls;function show(id){document.getElementById('scan').classList.toggle('hide',id!=='scan');document.getElementById('db').classList.toggle('hide',id!=='db');if(id==='db')renderDB()}function preview(i){let f=i.files[0];if(f)document.getElementById('pic').innerHTML='<img style="max-width:100%;border-radius:10px;margin:8px 0" src="'+URL.createObjectURL(f)+'">'}function loadStrip(){strip=[6,14,20,30,34,38,42,45].map(i=>({internal:db[i].internal,description:db[i].description,expected:i%3+1,scanned:0}));render();status('ok','Strip demo caricata correttamente')}function render(){document.getElementById('rows').innerHTML=strip.map(x=>'<tr><td>'+x.description+'</td><td>'+x.expected+'</td><td>'+x.scanned+'</td></tr>').join('');let e=strip.reduce((a,b)=>a+b.expected,0),s=strip.reduce((a,b)=>a+b.scanned,0);document.getElementById('sum').textContent='Previsti '+e+' · controllati '+s}function check(v){if(!strip.length)return status('warn','Prima carica la strip demo');let c=v||document.getElementById('code').value.trim();document.getElementById('code').value='';let p=db.find(x=>x.carton===c);if(!p)return status('warn','Codice sconosciuto: '+c);let r=strip.find(x=>x.internal===p.internal);if(!r)return status('bad','Collo non previsto: '+p.description);if(r.scanned>=r.expected)return status('bad','Quantità eccedente: '+p.description);r.scanned++;render();status('ok','Corretto: '+p.description);if(navigator.vibrate)navigator.vibrate(100)}function demo(c){check(c)}function status(t,m){document.getElementById('status').innerHTML='<div class="status '+t+'">'+m+'</div>'}async function camera(){if(!strip.length)return status('warn','Prima carica la strip demo');document.getElementById('cam').classList.remove('hide');try{reader=new ZXingBrowser.BrowserMultiFormatReader();controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},document.getElementById('video'),(r)=>{if(r){let v=r.getText();stop();check(v)}})}catch(e){status('warn','Fotocamera non disponibile. Usa inserimento manuale')}}function stop(){try{controls&&controls.stop()}catch(e){}document.getElementById('cam').classList.add('hide')}function renderDB(){let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('dbrows').innerHTML=db.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).map(x=>'<tr><td>'+x.internal+'</td><td>'+x.carton+'</td><td>'+x.description+'</td></tr>').join('')}function addProduct(){let i=prompt('Codice interno');if(!i)return;let c=prompt('Codice cartone');if(!c)return;let d=prompt('Descrizione');if(!d)return;db.push({internal:i,carton:c,description:d});localStorage.setItem('pdb',JSON.stringify(db));renderDB()}renderDB();</script></body></html>
