<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiornamento Controllo Pancali</title><style>body{font-family:Arial;background:#eef3f6;color:#14213d;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;padding:24px;border-radius:18px;max-width:520px;margin:16px;box-shadow:0 8px 24px #0002;text-align:center}button{padding:13px 18px;border:0;border-radius:12px;background:#102a43;color:white;font-weight:700;font-size:16px}</style></head><body><div class="box"><h2>Aggiornamento dell’app</h2><p>Sto rimuovendo la vecchia versione con due foto e caricando quella nuova a foto singola.</p><button onclick="cleanAndOpen()">Apri versione nuova</button></div><script>async function cleanAndOpen(){try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/pancali-demo/'))await r.unregister()}}if('caches'in window){const keys=await caches.keys();for(const k of keys){if(k.startsWith('pancali-'))await caches.delete(k)}}}catch(e){}location.replace('../pancali-demo/?version=single-photo-v8&ts='+Date.now())}cleanAndOpen();</script></body></html>
